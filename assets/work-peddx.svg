<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img"
     aria-label="In-distribution cases are classified; out-of-distribution cases are abstained on">
  <rect width="340" height="230" fill="#0a0c12"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 46h340M0 92h340M0 138h340M0 184h340M68 0v230M136 0v230M204 0v230M272 0v230"/>
  </g>
  <!-- decision boundary -->
  <path d="M170 16 C 140 76, 200 146, 170 210" fill="none" stroke="#ffffff"
        stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- class A -->
  <g fill="#5ee7ff">
    <circle cx="84"  cy="66"  r="5"/><circle cx="106" cy="90"  r="5"/>
    <circle cx="70"  cy="108" r="5"/><circle cx="98"  cy="126" r="5"/>
    <circle cx="120" cy="62"  r="5"/><circle cx="80"  cy="148" r="5"/>
  </g>
  <!-- class B -->
  <g fill="#a98bff">
    <circle cx="226" cy="74"  r="5"/><circle cx="252" cy="102" r="5"/>
    <circle cx="218" cy="124" r="5"/><circle cx="256" cy="148" r="5"/>
    <circle cx="234" cy="166" r="5"/>
  </g>
  <!-- abstained: out of distribution -->
  <g fill="none" stroke="#7cf0b8" stroke-opacity="0.85" stroke-width="1.6">
    <circle cx="158" cy="40"  r="10" stroke-dasharray="3 3"/>
    <circle cx="180" cy="192" r="10" stroke-dasharray="3 3"/>
    <circle cx="300" cy="44"  r="10" stroke-dasharray="3 3"/>
  </g>
  <g fill="#7cf0b8">
    <circle cx="158" cy="40"  r="3"/>
    <circle cx="180" cy="192" r="3"/>
    <circle cx="300" cy="44"  r="3"/>
  </g>
  <text x="16" y="216" font-family="ui-monospace, Menlo, monospace" font-size="10"
        fill="#67718a" letter-spacing="1">dashed = abstained (out of distribution)</text>
</svg>
