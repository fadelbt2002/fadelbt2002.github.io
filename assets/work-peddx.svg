<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"
     aria-label="In-distribution cases are classified; out-of-distribution cases are abstained on">
  <rect width="320" height="220" fill="#fbfbfa"/>
  <!-- decision boundary -->
  <path d="M160 18 C 132 74, 188 140, 160 202" fill="none" stroke="#c9c6bf"
        stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- in-distribution clusters -->
  <g fill="#8f1d21">
    <circle cx="78"  cy="66"  r="5"/><circle cx="98" cy="88" r="5"/>
    <circle cx="66"  cy="104" r="5"/><circle cx="92" cy="120" r="5"/>
    <circle cx="112" cy="62"  r="5"/><circle cx="74" cy="140" r="5"/>
  </g>
  <g fill="#2b2b2b">
    <circle cx="214" cy="72"  r="5"/><circle cx="238" cy="98" r="5"/>
    <circle cx="206" cy="118" r="5"/><circle cx="242" cy="140" r="5"/>
    <circle cx="222" cy="158" r="5"/>
  </g>
  <!-- out-of-distribution points, ringed = abstained -->
  <g fill="none" stroke="#8a8781" stroke-width="1.5">
    <circle cx="150" cy="40"  r="9" stroke-dasharray="3 3"/>
    <circle cx="168" cy="182" r="9" stroke-dasharray="3 3"/>
    <circle cx="284" cy="40"  r="9" stroke-dasharray="3 3"/>
  </g>
  <g fill="#8a8781">
    <circle cx="150" cy="40"  r="3"/>
    <circle cx="168" cy="182" r="3"/>
    <circle cx="284" cy="40"  r="3"/>
  </g>
  <text x="18" y="208" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8a8781">
    dashed rings = abstained (out of distribution)
  </text>
</svg>
