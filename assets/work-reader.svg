<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"
     aria-label="Reader accuracy compared across unaided, AI-assisted, and uncertainty-aware AI-assisted arms">
  <rect width="320" height="220" fill="#fbfbfa"/>
  <line x1="46" y1="24" x2="46" y2="170" stroke="#c9c6bf" stroke-width="1.5"/>
  <line x1="46" y1="170" x2="296" y2="170" stroke="#c9c6bf" stroke-width="1.5"/>
  <!-- three arms -->
  <rect x="74"  y="112" width="52" height="58"  fill="#d9d5ce"/>
  <rect x="146" y="84"  width="52" height="86"  fill="#c2777a"/>
  <rect x="218" y="52"  width="52" height="118" fill="#8f1d21"/>
  <!-- reader-level scatter over each bar -->
  <g fill="#2b2b2b" opacity="0.55">
    <circle cx="88"  cy="120" r="2.5"/><circle cx="104" cy="106" r="2.5"/><circle cx="116" cy="126" r="2.5"/>
    <circle cx="160" cy="92"  r="2.5"/><circle cx="176" cy="76"  r="2.5"/><circle cx="188" cy="98"  r="2.5"/>
    <circle cx="232" cy="60"  r="2.5"/><circle cx="248" cy="44"  r="2.5"/><circle cx="260" cy="66"  r="2.5"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8a8781" text-anchor="middle">
    <text x="100" y="186">unaided</text>
    <text x="172" y="186">+ AI</text>
    <text x="244" y="186">+ AI</text>
    <text x="244" y="198">+ uncertainty</text>
  </g>
  <text x="14" y="20" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8a8781">accuracy</text>
</svg>
