<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img"
     aria-label="Per-patient risk scores shown with confidence intervals">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
  </defs>
  <rect width="340" height="230" fill="#0a0c12"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 40h340M0 80h340M0 120h340M0 160h340"/>
  </g>
  <line x1="40" y1="26" x2="40" y2="190" stroke="#ffffff" stroke-opacity="0.16"/>
  <line x1="40" y1="190" x2="312" y2="190" stroke="#ffffff" stroke-opacity="0.16"/>
  <!-- confidence intervals: some tight, some wide -->
  <g stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <line x1="70"  y1="56"  x2="70"  y2="86"/>
    <line x1="104" y1="74"  x2="104" y2="96"/>
    <line x1="138" y1="46"  x2="138" y2="132"/>
    <line x1="172" y1="100" x2="172" y2="122"/>
    <line x1="206" y1="70"  x2="206" y2="158"/>
    <line x1="240" y1="122" x2="240" y2="146"/>
    <line x1="274" y1="88"  x2="274" y2="170"/>
  </g>
  <g fill="#5ee7ff">
    <circle cx="70"  cy="71"  r="4.2"/>
    <circle cx="104" cy="85"  r="4.2"/>
    <circle cx="138" cy="89"  r="4.2"/>
    <circle cx="172" cy="111" r="4.2"/>
    <circle cx="206" cy="114" r="4.2"/>
    <circle cx="240" cy="134" r="4.2"/>
    <circle cx="274" cy="129" r="4.2"/>
  </g>
  <text x="40" y="214" font-family="ui-monospace, Menlo, monospace" font-size="10"
        fill="#67718a" letter-spacing="1">patients, ordered by predicted risk</text>
  <text x="14" y="22" font-family="ui-monospace, Menlo, monospace" font-size="10"
        fill="#67718a" letter-spacing="1">risk</text>
</svg>
